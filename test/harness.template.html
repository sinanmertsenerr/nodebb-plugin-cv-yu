<!doctype html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>cv-yu harness</title>
	<!-- NodeBB dışında test sayfası: build.mjs bunu static/dist/harness.html olarak gerçek dosya adlarıyla üretir -->
	<link rel="stylesheet" href="./{{css}}">
	<style>
		:root { --bs-body-font-family: Inter, system-ui, sans-serif; --bs-body-color: #1f272b; --bs-body-bg: #fff; }
		body { margin: 0; font-family: var(--bs-body-font-family); }
	</style>
	<script src="../../test/sample-profile.js"></script>
	<script src="./{{js}}"></script>
</head>
<body>
	<div id="cv-yu-root" class="cv-yu-page"></div>
	<script>
		(function () {
			var params = new URLSearchParams(location.hash.replace(/^#/, ''));
			var profile = window.SAMPLE_PROFILE;
			if (params.get('template')) profile.settings.template = params.get('template');
			if (params.get('lang')) profile.settings.lang = params.get('lang');
			var initial = { profiles: { ornek1: profile }, activeId: 'ornek1', account: { enabled: false, consentAt: 0 }, lastBackup: Date.now(), changes: 0 };
			window.YuCV.mount(document.getElementById('cv-yu-root'), { uid: 0, relativePath: '', csrf: '', uiLang: params.get('ui') || 'tr', fonts: '', initial: initial });
		}());
	</script>
</body>
</html>
